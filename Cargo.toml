[workspace]
resolver = "2"
members = [
  "crates/iran-split-config",
  "crates/iran-split-clients",
  "crates/iran-split-core",
  "crates/iran-split-ipc",
  "crates/iran-split-mihomo",
  "crates/iran-split-rules",
  "crates/iran-split-platform-linux",
  "crates/iran-split-platform-win",
  "crates/iran-split-helper",
  "crates/iran-split-helper-winacl",
  "crates/iran-split-cli",
  "src-tauri",
]

[workspace.package]
version = "5.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
publish = false

[workspace.dependencies]
async-trait = "0.1.88"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.1"
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
idna = "1.0.3"
ipnet = { version = "2.11.0", features = ["serde"] }
psl = "2.1.148"
nix = { version = "0.30.1", features = ["socket", "user", "signal", "process", "fs"] }
rand = "0.9.1"
regex = "1.11.1"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["full"] }
tokio-util = "0.7.15"
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8.22"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
